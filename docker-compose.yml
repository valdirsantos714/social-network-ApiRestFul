version: '3.8'

services:
  database:
    image: mysql:latest
    container_name: mysql_cont
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: nome_do_banco
      MYSQL_USER: usuario
      MYSQL_PASSWORD: senha_usuario
    networks:
      - app_network
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  api:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: api_container
    environment:
      DB_HOST: database
      DB_USER: usuario
      DB_PASSWORD: senha_usuario
      DATABASE: nome_do_banco
    depends_on:
      - database
    networks:
      - app_network
    ports:
      - "8080:8080"
    entrypoint: ["/app/wait-for-it.sh", "database:3306", "--timeout=90", "--", "java", "-jar", "/app/app.jar"]

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data:
